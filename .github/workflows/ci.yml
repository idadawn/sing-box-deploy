name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression tests
        run: bash tests/run.sh
      - name: Install pinned Cloudflare runtime
        run: npm ci --prefix cloudflare-pages-sub
      - name: Verify authentication in Pages and D1 runtime
        run: node tests/auth-runtime.mjs

      - name: Verify retired subscription site in Pages runtime
        run: node tests/retired-runtime.mjs
