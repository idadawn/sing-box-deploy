<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>自由翱翔 · 个人办公空间</title>
  <meta name="description" content="自由翱翔，为个人办公提供专属线路管理与客户端快捷导入。">
  <link rel="stylesheet" href="/portal.css">
  <script src="/portal.js" defer></script>
</head>
<body>
  <main>
    <header><a class="brand" href="/">自由翱翔<span>个人办公空间</span></a><span class="badge">个人空间</span></header>
    <p id="message" role="status" aria-live="polite"></p>
    <section id="loginView" class="login panel" hidden>
      <h1>登录</h1>
      <form id="loginForm">
        <label>账号<input name="username" autocomplete="username" required maxlength="32" autocapitalize="none" spellcheck="false"></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label>
        <button class="primary" type="submit">登录</button>
      </form>
      <p class="hint">请使用分配给你的账号登录。</p>
    </section>
    <section id="activateView" class="login panel" hidden>
      <h1>设置登录密码</h1>
      <form id="activateForm">
        <label>新密码<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label>
        <label>确认密码<input name="confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label>
        <p class="hint">至少 12 位，建议使用密码管理器生成。</p>
        <button class="primary" type="submit">设置密码并进入</button>
      </form>
    </section>
    <section id="accountView" hidden>
      <div class="heading"><div><p class="eyebrow" id="accountName"></p><h1>我的线路</h1></div><button id="logout" class="quiet">退出登录</button></div>
      <p id="quotaAlert" class="quota-alert" role="status" hidden></p>
      <div id="entries" class="entries"></div>
      <p class="hint billing-cycle">每月 1 日 00:00 UTC 重置 · 个人用量包含在整机公共额度内</p>
      <details class="usage-help"><summary>使用帮助</summary><p class="hint">v2rayNG 用于 Android，Shadowrocket 用于 iPhone / iPad。未唤起时，可复制链接手动添加。导入后在客户端更新订阅，退出网页登录不影响更新。</p></details>
      <section class="panel settings"><h2>账号</h2>
        <details><summary>修改登录密码</summary><form id="passwordForm" class="password-form">
          <label>原密码<input name="currentPassword" type="password" autocomplete="current-password" required maxlength="128"></label>
          <label>新密码<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label>
          <button type="submit">保存新密码</button><p class="hint">保存后所有网页会话退出，订阅链接保持不变。</p>
        </form></details>
        <details><summary>重置专属订阅链接</summary><p class="muted">重置后旧链接立即失效。你需要在所有客户端中替换订阅链接。</p><button id="rotate" class="danger">确认重置链接</button></details>
      </section>
    </section>
    <footer>自由翱翔 · 专注个人办公</footer>
  </main>
</body>
</html>
